services:
  comfyui-image-frontend:
    build:
      context: .
    image: comfyui-image-frontend:local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    env_file:
      # Non-secret deployment defaults supply both household ComfyUI runtimes.
      # The private .env is loaded last so an explicit operator configuration wins.
      - deployment/comfyui-instances.env
      - .env
    volumes:
      - application-data:/data
    # Allows host.docker.internal URLs to reach services running directly on
    # the Docker host. The household worker default uses its supplied LAN URL
    # and therefore does not require an additional Docker network attachment.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Service Portal "Update and restart" opt-in. The portal reads these live
    # labels from the running container and, after operator confirmation, runs
    # the repository's update script in a detached maintenance container from
    # an existing local runner image (bash, Git, Docker CLI, Compose v2).
    # The runner image must already exist on the Docker host; build it once
    # with:
    #   docker build -t "${PROJECT_RUNNER_IMAGE:-comfyui-image-frontend-portal-runner:latest}" \
    #     deployment/runner
    # Set HOST_UID/HOST_GID to the numeric owner of this host checkout
    # (id -u; id -g) so Git never creates root-owned files. After changing
    # these labels, recreate this service so Docker records them. If you
    # deploy from another Compose file, keep the four labels identical there.
    labels:
      io.service-portal.update.enabled: "true"
      io.service-portal.update.script: "scripts/update-and-restart.sh"
      io.service-portal.update.image: "${PROJECT_RUNNER_IMAGE:-comfyui-image-frontend-portal-runner:latest}"
      io.service-portal.update.user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3); p=json.load(r); assert r.status == 200 and p['database'] and p['worker']['ready']"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  application-data:
    # An explicit name keeps documented backup/restore commands stable even
    # when the Compose project directory is renamed.
    name: comfyui-image-frontend-data
