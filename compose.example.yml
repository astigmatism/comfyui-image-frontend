services:
  comfyui-image-frontend:
    build:
      context: .
    image: comfyui-image-frontend:local
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - application-data:/data
    # Allows host.docker.internal URLs to reach services running directly on
    # the Docker host. The ComfyUI service DNS names in .env.example instead
    # require this frontend service to join their existing user-defined Docker
    # network. Add that network to this service/declaration without restarting
    # or recreating either ComfyUI container; see README.md.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3); p=json.load(r); assert r.status == 200 and p['database'] and p['worker']['ready']"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  application-data:
    # An explicit name keeps documented backup/restore commands stable even
    # when the Compose project directory is renamed.
    name: comfyui-image-frontend-data
