# Reference only: --install writes these four app labels into the existing
# JSON compose.yaml. Do not add this as a second Compose file.
# Replace <reviewed-full-sha> with the installed runner's exact revision/tag.
services:
  comfyui-image-frontend:
    labels:
      io.service-portal.update.enabled: "true"
      io.service-portal.update.script: "update_production_portal"
      io.service-portal.update.image: "local/comfyui-image-frontend-release:<reviewed-full-sha>"
      io.service-portal.update.user: "1000:1000"
