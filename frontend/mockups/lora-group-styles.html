<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>LoRA dialog · groups, captions and thumbnail-free LoRAs · design preview</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="./lora-group-styles.css" />
  </head>
  <body class="lgs-preview-host">
    <header class="lgs-preview-toolbar">
      <div class="lgs-preview-title">
        <strong>LoRA dialog · groups, captions and thumbnail-free LoRAs</strong>
        <span>Design preview · the proposed side is the production dialog markup</span>
      </div>
      <div class="lgs-preview-actions" role="group" aria-label="Preview controls">
        <button type="button" class="button low is-selected" data-preview-layout="proposed" aria-pressed="true">Proposed</button>
        <button type="button" class="button low" data-preview-layout="current" aria-pressed="false">Retired design</button>
        <label class="visually-hidden" for="preview-mode">Dialog mode</label>
        <select id="preview-mode" aria-label="Dialog mode">
          <option value="management">Management (admin)</option>
          <option value="picker">LoRA picker</option>
        </select>
        <label class="visually-hidden" for="preview-popover">LoRA menu</label>
        <select id="preview-popover" aria-label="LoRA menu">
          <option value="closed">Menu closed</option>
          <option value="open">Menu open on a thumbnail-free LoRA</option>
        </select>
        <label class="visually-hidden" for="preview-scale">Thumbnail size</label>
        <select id="preview-scale" aria-label="Thumbnail size">
          <option value="50">Thumbnail size 50%</option>
          <option value="100" selected>Thumbnail size 100%</option>
          <option value="150">Thumbnail size 150%</option>
        </select>
        <button type="button" class="button low is-selected" data-preview-size="desktop" aria-pressed="true">Desktop</button>
        <button type="button" class="button low" data-preview-size="mobile" aria-pressed="false">Narrow screen</button>
        <button type="button" class="button secondary" data-preview-action="open">Open dialog</button>
      </div>
    </header>
    <main class="lgs-preview-stage">
      <iframe id="lgs-preview-frame" title="LoRA dialog styling mockup" src="./lora-group-styles-scene.html"></iframe>
    </main>
    <script type="module" src="./lora-group-styles-host.mjs"></script>
  </body>
</html>
