<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Creative Direction expectations · design preview</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="./expectation-check.css" />
  </head>
  <body class="xc-preview-host">
    <header class="xc-preview-toolbar">
      <div class="xc-preview-title">
        <strong>Creative Direction · Expectations</strong>
        <span>Interactive design preview · sample images and simulated vision scores</span>
      </div>
      <div class="xc-preview-actions" role="group" aria-label="Preview controls">
        <button type="button" class="button low is-selected" data-preview-size="desktop" aria-pressed="true">Desktop</button>
        <button type="button" class="button low" data-preview-size="mobile" aria-pressed="false">Narrow screen</button>
        <label class="visually-hidden" for="xc-preview-scenario">Scenario</label>
        <select id="xc-preview-scenario" aria-label="Scenario">
          <option value="configured">1 · Sidebar configured</option>
          <option value="running">2 · Running</option>
          <option value="passed-apply">3 · Passed (Apply)</option>
          <option value="passed-generate">4 · Passed (Generate)</option>
          <option value="not-met">5 · Not met</option>
          <option value="failed">6a · Failed</option>
          <option value="stopped">6b · Stopped</option>
          <option value="vision-unavailable">7a · Vision unavailable</option>
          <option value="auto-on">7b · Auto-generate on</option>
        </select>
        <button type="button" class="button secondary" data-preview-action="open">Open modal</button>
        <button type="button" class="button secondary" data-preview-action="simulate">Simulate run</button>
        <button type="button" class="button low" data-preview-action="reset">Reset</button>
      </div>
    </header>
    <main class="xc-preview-stage">
      <iframe id="xc-preview-frame" title="Interactive Creative Direction expectations mockup" src="./expectation-check-scene.html"></iframe>
    </main>
    <script type="module" src="./expectation-check-host.mjs"></script>
  </body>
</html>
